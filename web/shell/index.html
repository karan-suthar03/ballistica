<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BombSquad">
<meta name="theme-color" content="#0a0e1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>BombSquad Web</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  /* Fills the visible screen edge to edge (no notch gap). Explicit
     sizes: a canvas with width:auto takes its pixel size (2-3x the screen
     on phones); 100dvh is the visible height, unlike 100vh on Android. */
  canvas {
    display: block; position: fixed; left: 0; top: 0; touch-action: none;
    width: 100vw; height: 100vh; height: 100dvh;
  }
</style>
<link rel="stylesheet" href="loader.css?v=__BUILD__">
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="loader">
  <img class="logo" src="logo.png?v=__BUILD__" alt="">
  <h1>Bomb<span>Squad</span></h1>
  <div class="panel">
    <div class="row"><span class="stage">Getting ready</span><span class="pct">0%</span></div>
    <div class="track"><div class="fill"></div></div>
    <p class="hint">The first visit downloads the game (about 55 MB).<br>Later visits load from your browser's cache.</p>
    <p class="hint credit">Web &amp; online port by <b>Karan</b> · <a href="https://github.com/karan-suthar03" target="_blank" rel="noopener">@karan-suthar03</a></p>
  </div>
  <div class="version">__VERSION__</div>
</div>
<div id="rotate"><img src="logo.png?v=__BUILD__" alt=""><p>Rotate your phone to landscape</p></div>
<script src="loader.js?v=__BUILD__"></script>
<script src="fullscreen.js?v=__BUILD__"></script>
<script>
  // Mirror all engine output to the dev server (POST /log) so it can be
  // read without browser devtools (handy on iPhone).
  const logQueue = [];
  let logTimer = null;
  function sendLogs() {
    logTimer = null;
    if (!logQueue.length) return;
    const body = logQueue.splice(0).join('\n') + '\n';
    fetch(LOG_URL, { method: 'POST', body }).catch(() => {});
  }
  // Local previews log everything to the dev server; the deployed site
  // sends only errors, warnings and connection events to the gateway.
  const LOCAL = ['localhost', '127.0.0.1'].includes(location.hostname);
  const LOG_URL = LOCAL ? 'log' : 'https://play.karansuthar.me/log';
  let logId = '';
  try { logId = (localStorage.getItem('baMachineId') || '').slice(0, 8); } catch (e) {}
  function log(kind, text) {
    (kind === 'err' ? console.error : console.log)(text);
    if (!LOCAL && kind !== 'err'
        && !/WARNING|ERROR|Traceback|\[udp\]|ua=|ABORT/.test(text)) return;
    if (!LOCAL) text = `${logId} ${text}`;
    logQueue.push(`[${(performance.now() / 1000).toFixed(2)}] ${kind}: ${text}`);
    if (!logTimer) logTimer = setTimeout(sendLogs, 250);
  }
  window.addEventListener('error', e => log('err', `window error: ${e.message} @ ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', e => log('err', `unhandled rejection: ${e.reason}`));

  log('out', `ua=${navigator.userAgent} crossOriginIsolated=${self.crossOriginIsolated}`);

  // Stamped by package.sh. Every file URL carries it, so a new build is a
  // new URL: Cloudflare's Browser Cache TTL overrides our no-cache with
  // max-age=14400, and a stale .data.js against a fresh .data hands
  // Python garbage files ("Failed to import encodings module").
  const BUILD = '__BUILD__';

  // The player's name is asked in-game (bauiv1lib/webname.py); the game
  // reports it as '@@name <name>' and we remember it here, passing it
  // back as BA_DEVICE_NAME on the next visit.
  const NAME_KEY = 'baPlayerName';
  let playerName = '';
  try { playerName = (localStorage.getItem(NAME_KEY) || '').trim().slice(0, 16); } catch (e) {}

  var Module = {
    canvas: document.getElementById('canvas'),
    locateFile: path => `${path}?v=${BUILD}`,
    print: t => {
      if (t.startsWith('@@stage ')) Loader.stage(t.slice(8));
      if (t.startsWith('@@name ')) {
        try { localStorage.setItem(NAME_KEY, t.slice(7).trim().slice(0, 16)); } catch (e) {}
        return;
      }
      log('out', t);
    },
    printErr: t => log('err', t),
    setStatus: t => {
      // "Downloading data... (a/b)": unpacked byte counts (the transfer
      // itself is brotli-compressed), so only the ratio is shown.
      const m = /\((\d+)\/(\d+)\)/.exec(t || '');
      if (m) {
        Loader.download(+m[1], +m[2]);
        return;
      }
      if (t) log('out', `status: ${t}`);
    },
    onAbort: what => { log('err', `ABORT: ${what}`); Loader.error('The game crashed'); },
    onRuntimeInitialized: () => { Loader.engine(); log('out', 'runtime initialized'); },
    // ?log=ba=DEBUG,ba.assetmanager=DEBUG -> BA_LOG_LEVELS for the engine.
    preRun: [() => {
      // The engine must want exactly the texture set we loaded.
      Module.ENV.BA_FORCE_TEXTURE_PROFILE = Module.texProfile;
      // Phones/tablets: enables the engine's on-screen touch controls.
      // Phones/tablets: on-screen touch controls, plus the UI layout the
      // native apps use (phone 'small' = biggest buttons; tablet 'medium').
      if (matchMedia('(pointer: coarse)').matches) {
        Module.ENV.BA_WEB_TOUCH = '1';
        const shortSide = Math.min(screen.width, screen.height);
        Module.ENV.BA_UI_SCALE = shortSide < 600 ? 'small' : 'medium';
      }
      // The engine identifies this device by /etc/machine-id (Linux);
      // give each browser a stable random one.
      let mid = null;
      try { mid = localStorage.getItem('baMachineId'); } catch (e) {}
      if (!mid || !/^[0-9a-f]{32}$/.test(mid)) {
        mid = Array.from(crypto.getRandomValues(new Uint8Array(16)),
          b => b.toString(16).padStart(2, '0')).join('');
        try { localStorage.setItem('baMachineId', mid); } catch (e) {}
      }
      try {
        Module.FS.mkdirTree('/etc');
        Module.FS.writeFile('/etc/machine-id', mid + '\n');
      } catch (e) { log('err', `machine-id: ${e}`); }
      if (playerName) Module.ENV.BA_DEVICE_NAME = playerName;
      // ?server=ip:port: which server the Gather button joins.
      const server = new URLSearchParams(location.search).get('server');
      if (server) Module.ENV.BA_HOME_SERVER = server;
      const levels = new URLSearchParams(location.search).get('log');
      if (levels) {
        Module.ENV.BA_LOG_LEVELS = levels;
        log('out', `BA_LOG_LEVELS=${levels}`);
      }
    }],
  };
</script>
<script src="baudp.js?v=__BUILD__"></script>
<script>
  // Load base data, the one texture package this GPU can use, then the
  // engine. Same order as Assets::PreferredTextureProfile on web: BC7 ->
  // desktop_v1, ASTC -> mobile_v1, else fallback_v1. ?tex=<profile>
  // overrides.
  (() => {
    let profile = new URLSearchParams(location.search).get('tex');
    if (!profile) {
      const gl = document.createElement('canvas').getContext('webgl2');
      const exts = (gl && gl.getSupportedExtensions()) || [];
      profile = exts.includes('EXT_texture_compression_bptc') ? 'desktop_v1'
        : exts.includes('WEBGL_compressed_texture_astc') ? 'mobile_v1'
        : 'fallback_v1';
      const lose = gl && gl.getExtension('WEBGL_lose_context');
      if (lose) lose.loseContext();
    }
    log('out', `texture profile: ${profile}`);
    Module.texProfile = profile;
    for (const src of ['ballisticakit.data.js', `tex-${profile}.data.js`,
                       'ballisticakit.js']) {
      const s = document.createElement('script');
      s.src = `${src}?v=${BUILD}`;
      s.async = false;
      document.body.appendChild(s);
    }
  })();
</script>
</body>
</html>
