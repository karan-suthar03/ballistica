<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>BombSquad Web</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #status { position: fixed; left: 0; right: 0; bottom: 12px; text-align: center;
            color: #ccc; font: 14px system-ui, sans-serif; pointer-events: none; }
  #start { position: fixed; inset: 0; display: flex; align-items: center;
           justify-content: center; background: #000; color: #fff;
           font: 600 22px system-ui, sans-serif; cursor: pointer; }
  #start[hidden] { display: none; }
</style>
</head>
<body>
<canvas id="canvas" tabindex="-1"></canvas>
<div id="status">Loading…</div>
<div id="start" hidden>Tap to start</div>
<script>
  // Mirror all engine output to the dev server (POST /log) so it can be
  // read without browser devtools (handy on iPhone).
  const logQueue = [];
  let logTimer = null;
  function sendLogs() {
    logTimer = null;
    if (!logQueue.length) return;
    const body = logQueue.splice(0).join('\n') + '\n';
    fetch('log', { method: 'POST', body }).catch(() => {});
  }
  function log(kind, text) {
    (kind === 'err' ? console.error : console.log)(text);
    logQueue.push(`[${(performance.now() / 1000).toFixed(2)}] ${kind}: ${text}`);
    if (!logTimer) logTimer = setTimeout(sendLogs, 250);
  }
  window.addEventListener('error', e => log('err', `window error: ${e.message} @ ${e.filename}:${e.lineno}`));
  window.addEventListener('unhandledrejection', e => log('err', `unhandled rejection: ${e.reason}`));

  log('out', `ua=${navigator.userAgent} crossOriginIsolated=${self.crossOriginIsolated}`);

  const status = document.getElementById('status');
  var Module = {
    canvas: document.getElementById('canvas'),
    print: t => log('out', t),
    printErr: t => log('err', t),
    setStatus: t => {
      // "Downloading data... (a/b)" -> "Downloading… 12 / 60 MB (20%)".
      const m = /\((\d+)\/(\d+)\)/.exec(t || '');
      if (m) {
        const mb = n => (n / 1e6).toFixed(0);
        status.textContent = `Downloading… ${mb(m[1])} / ${mb(m[2])} MB` +
          ` (${Math.floor(100 * m[1] / m[2])}%)`;
        return;
      }
      status.textContent = t;
      if (t) log('out', `status: ${t}`);
    },
    onAbort: what => log('err', `ABORT: ${what}`),
    onRuntimeInitialized: () => { status.textContent = ''; log('out', 'runtime initialized'); },
    // ?log=ba=DEBUG,ba.assetmanager=DEBUG -> BA_LOG_LEVELS for the engine.
    preRun: [() => {
      // The engine must want exactly the texture set we loaded.
      Module.ENV.BA_FORCE_TEXTURE_PROFILE = Module.texProfile;
      const levels = new URLSearchParams(location.search).get('log');
      if (levels) {
        Module.ENV.BA_LOG_LEVELS = levels;
        log('out', `BA_LOG_LEVELS=${levels}`);
      }
    }],
  };
</script>
<script>
  // Load base data, the one texture package this GPU can use, then the
  // engine. Same order as Assets::PreferredTextureProfile on web: BC7 ->
  // desktop_v1, ASTC -> mobile_v1, else fallback_v1. ?tex=<profile>
  // overrides.
  (() => {
    let profile = new URLSearchParams(location.search).get('tex');
    if (!profile) {
      const gl = document.createElement('canvas').getContext('webgl2');
      const exts = (gl && gl.getSupportedExtensions()) || [];
      profile = exts.includes('EXT_texture_compression_bptc') ? 'desktop_v1'
        : exts.includes('WEBGL_compressed_texture_astc') ? 'mobile_v1'
        : 'fallback_v1';
      const lose = gl && gl.getExtension('WEBGL_lose_context');
      if (lose) lose.loseContext();
    }
    log('out', `texture profile: ${profile}`);
    Module.texProfile = profile;
    for (const src of ['ballisticakit.data.js', `tex-${profile}.data.js`,
                       'ballisticakit.js']) {
      const s = document.createElement('script');
      s.src = src;
      s.async = false;
      document.body.appendChild(s);
    }
  })();
</script>
</body>
</html>
